name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Deploy to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # 1. 克隆 Hugging Face Space
          git clone https://huggingface.co/spaces/${HF_SPACE_ID} temp_space

          # 2. 复制必要文件
          cp app.py model.pkl tfidf.pkl requirements.txt temp_space/

          # 3. 进入目录并提交
          cd temp_space
          git add .
          git commit -m "Update from GitHub" || true

          # 4. 关键修改：直接在 push URL 里带上 token
          git push https://${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID} main
