name: build-and-deploy

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: |
          python train.py

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          # 克隆 Hugging Face Space 仓库
          git clone https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME} space
          # 复制必要文件（排除space目录本身）
          cp -r app.py model.pkl tfidf.pkl requirements.txt space/
          # 进入space目录并推送
          cd space
          git add .
          git commit -m "Deploy from GitHub Actions" || echo "No changes to commit"
          git push https://${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME} main
