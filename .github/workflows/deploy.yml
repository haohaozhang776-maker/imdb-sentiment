name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Deploy to Space
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # 克隆你的 Hugging Face Space
          git clone https://${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ secrets.HF_SPACE_ID }} temp_space

          # 只复制需要的文件，不会循环复制！
          cp app.py model.pkl tfidf.pkl requirements.txt temp_space/

          # 提交并推送
          cd temp_space
          git add .
          git commit -m "Update from GitHub" || true
          git push
