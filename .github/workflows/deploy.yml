name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train model
        run: python train.py
      - name: Deploy to HF
        uses: huggingface/huggingface-space-deployer@main
        with:
          api-token: ${{ secrets.HF_TOKEN }}
          space-id: zhanghaohao0420/imdb-sentiment
